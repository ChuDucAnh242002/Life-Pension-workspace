spring:
  datasource:
    url: ${DATABASE_URL:jdbc:oracle:thin:@oracle:1521/FREEPDB1}
    username: ${DATABASE_USER:workspace}
    password: ${DATABASE_PASSWORD}
  jackson:
    deserialization:
      fail-on-unknown-properties: true
server:
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: strict
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
app:
  adviser-user: ${ADVISER_USER:adviser}
  adviser-password: ${ADVISER_PASSWORD}
