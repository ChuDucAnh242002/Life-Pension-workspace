name: life-pension-demo
services:
  app:
    build: .
    image: life-pension-workspace:local
    ports:
      - "127.0.0.1:${APP_PORT:-8089}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: demo
      DEMO_DB_PATH: /data/workspace
      ADVISER_USER: adviser
      ADVISER_PASSWORD: local-demo-password
      DATABASE_PASSWORD: local-demo-database
    volumes:
      - demo-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
    restart: unless-stopped
volumes:
  demo-data:
