apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: workspace-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: workspace
spec:
  selector:
    app: workspace
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: workspace
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: workspace
  template:
    metadata:
      labels:
        app: workspace
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: life-pension-workspace:step6
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: demo
            - name: DEMO_DB_PATH
              value: /data/workspace
            - name: ADVISER_USER
              value: adviser
            - name: ADVISER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: workspace-auth
                  key: adviser-password
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: workspace-auth
                  key: database-password
            - name: AI_ENABLED
              value: "false"
            - name: POLICY_TRANSPORT
              value: demo
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 768Mi
          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 15
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: workspace-data
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
