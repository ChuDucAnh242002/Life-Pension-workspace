apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: life-pension-vault
resources:
  - ../demo
  - vault-resources.yaml
patches:
  - target:
      kind: Namespace
      name: life-pension-demo
    patch: |-
      - op: replace
        path: /metadata/name
        value: life-pension-vault
