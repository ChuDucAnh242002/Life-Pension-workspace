name: Verify case workspace
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: mvn -B verify
        working-directory: backend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-briefing-evaluation
          path: backend/target/briefing-evaluation-offline.json
          if-no-files-found: warn
      - run: npm ci && npm run lint && npm test && npm run build
        working-directory: frontend
      - run: docker compose --env-file /dev/null -f compose.demo.yaml up --build -d --wait
      - run: node scripts/smoke.mjs
      - run: node --test scripts/*.test.mjs
      - run: npx playwright install --with-deps chromium && npm run test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-results
          path: frontend/test-results
      - run: docker compose --env-file /dev/null -f compose.demo.yaml down --volumes
        if: always()
